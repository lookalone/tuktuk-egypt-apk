name: Build TukTuk Egypt APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract latest game project
        run: |
          unzip -q TukTuk-Egypt-Android-Cloud-Build-Fullscreen.zip -d extracted
          test -f extracted/tuktuk-android-ready/package.json
          test -f extracted/tuktuk-android-ready/www/index.html
          test -f extracted/tuktuk-android-ready/www/style.css

      - name: Install dependencies
        working-directory: extracted/tuktuk-android-ready
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: extracted/tuktuk-android-ready
        run: npx cap add android

      - name: Enable immersive full-screen landscape
        working-directory: extracted/tuktuk-android-ready
        shell: bash
        run: |
          MAIN_ACTIVITY="$(find android/app/src/main/java -name 'MainActivity.java' -print -quit)"
          test -n "$MAIN_ACTIVITY"
          PACKAGE="$(sed -n 's/^package \([^;]*\);/\1/p' "$MAIN_ACTIVITY" | head -n 1)"
          test -n "$PACKAGE"
          cat > "$MAIN_ACTIVITY" <<EOF
          package $PACKAGE;

          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
                  getWindow().setStatusBarColor(Color.rgb(11, 13, 20));
                  getWindow().setNavigationBarColor(Color.rgb(11, 13, 20));
                  if (Build.VERSION.SDK_INT >= 29) {
                      getWindow().setStatusBarContrastEnforced(false);
                      getWindow().setNavigationBarContrastEnforced(false);
                  }
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams params = getWindow().getAttributes();
                      params.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(params);
                  }
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              @SuppressWarnings("deprecation")
              private void hideSystemBars() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      );
                  }
              }
          }
          EOF

      - name: Sync game files
        working-directory: extracted/tuktuk-android-ready
        run: npx cap sync android

      - name: Build debug APK
        working-directory: extracted/tuktuk-android-ready/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TukTuk-Egypt-APK
          path: extracted/tuktuk-android-ready/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
